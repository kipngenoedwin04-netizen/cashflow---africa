<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="theme-color" content="#071b16">
  <title>CASHFLOW AFRICA</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #071b16;
      color: white;
      text-align: center;
    }
    header {
      padding: 25px 15px;
      background: #0d2b21;

    .hero { padding: 65px 20px; }
    .hero h2 { font-size: 32px; }

    .btn {
      display: inline-block;
      padding: 14px 28px;
      margin: 10px;
      border-radius: 8px;
      background: #f4c542;
      color: #071b16;
      font-weight: bold;
      text-decoration: none;
    }
    footer { padding: 25px; color: #aaa; }
  </style>
</head>
<body>
  <header>
    <h1>CASHFLOW AFRICA</h1>

    <a href="#register" class="btn">Get Started</a>

  <footer>
    © 2026 CASHFLOW AFRICA. All rights reserved.
  </footer>

</html>
